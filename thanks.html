<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>קיר התודות לסבא וסבתא 💖</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- כותרת עליונה -->
  <header>
    <div class="logo">
      <span>💖</span> קיר התודות לסבא וסבתא
    </div>
    <nav>
      <a href="index.html" class="nav-link-btn"> חזרה לדף המתנות</a>
    </nav>
  </header>

  <div class="container">
    
    <!-- טופס שליחת תודה בתוך כרטיסיית זכוכית -->
    <div class="glass-card">
      <h2 style="margin-top: 0; text-align: center;">השאירו מכתב תודה לסבא וסבתא ✨</h2>
      <form id="thanksForm">
        <div class="form-group">
          <label for="authorName">שם הנכד/ה:</label>
          <input type="text" id="authorName" placeholder="הכניסו את שמכם..." required>
        </div>
        <div class="form-group">
          <label for="messageText">ההודעה שלכם:</label>
          <textarea id="messageText" placeholder="תודה רבה סבתא וסבא היקרים על המתנה הנפלאה! אוהב/ת המון..." required></textarea>
        </div>
        <button type="submit" class="btn">שליחת מכתב התודה לסבא וסבתא 🚀</button>
      </form>
    </div>

    <!-- כותרת הקיר -->
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px;">
      <h2>קיר התודות לסבא וסבתא (כל ההודעות שנשלחו)</h2>
      <span id="msgCount" style="background: linear-gradient(135deg, #ff609b, #ff91b8); color: white; padding: 6px 16px; border-radius: 20px; font-weight: bold; font-size: 0.95rem; box-shadow: 0 4px 15px rgba(255, 96, 155, 0.25);">0 הודעות</span>
    </div>

    <!-- רשימת הכרטיסיות (מתלבש בדיוק על ה-Grid של האתר) -->
    <div class="grid" id="cardsGrid"></div>

  </div>

  <script>
    // טעינת הודעות שמורות בזיכרון המקומי (LocalStorage)
    let messages = JSON.parse(localStorage.getItem('grandparents_thanks')) || [];

    const form = document.getElementById('thanksForm');
    const cardsGrid = document.getElementById('cardsGrid');
    const msgCount = document.getElementById('msgCount');

    function renderMessages() {
      cardsGrid.innerHTML = '';
      msgCount.textContent = `${messages.length} הודעות`;

      if (messages.length === 0) {
        cardsGrid.innerHTML = `
          <div class="glass-card" style="grid-column: 1 / -1; text-align: center; color: var(--text-muted);">
            <h3>עדיין אין הודעות על הקיר 💌</h3>
            <p>היו הראשונים לשלוח מכתב תודה מרגש לסבא וסבתא באמצעות הטופס למעלה!</p>
          </div>
        `;
        return;
      }

      messages.forEach(msg => {
        const card = document.createElement('div');
        card.className = 'item-card';
        card.innerHTML = `
          <div class="item-content">
            <div>
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 0.85rem; color: #8e7fb0;">
                <span>📅 ${msg.date}</span>
                <span style="background: #f7effb; padding: 4px 10px; border-radius: 10px; color: #7040a0; font-weight: bold;">נכד/ה אהוב/ה 💐</span>
              </div>
              <h3 style="margin-bottom: 8px; color: #563b7b;">${escapeHtml(msg.name)}</h3>
              <p style="white-space: pre-line; color: #554d65; line-height: 1.6;">${escapeHtml(msg.text)}</p>
            </div>
            <div style="border-top: 1px solid #f0e7f4; margin-top: 15px; padding-top: 12px; text-align: left; font-size: 0.85rem; color: #ff609b; font-weight: 700;">
              נשלח בהמון אהבה ❤️
            </div>
          </div>
        `;
        cardsGrid.appendChild(card);
      });
    }

    // פונקציית עזר למניעת בעיות אבטחה בטקסט
    function escapeHtml(text) {
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return text.replace(/[&<>"']/g, function(m) { return map[m]; });
    }

    // הוספת הודעה חדשה
    form.addEventListener('submit', function(e) {
      e.preventDefault();

      const nameInput = document.getElementById('authorName').value;
      const textInput = document.getElementById('messageText').value;

      const now = new Date();
      const formattedDate = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}, ${now.getDate()}.${now.getMonth()+1}.${now.getFullYear()}`;

      const newMessage = {
        id: Date.now(),
        name: nameInput,
        date: formattedDate,
        text: textInput
      };

      messages.unshift(newMessage); // הוספה לראש הרשימה
      localStorage.setItem('grandparents_thanks', JSON.stringify(messages)); // שמירה בדפדפן
      
      renderMessages();
      form.reset();
    });

    // טעינה ראשונית
    renderMessages();
  </script>
</body>
</html>
